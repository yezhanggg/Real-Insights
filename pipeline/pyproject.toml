[project]
name = "realinsights-pipeline"
version = "0.1.0"
description = "Turns spatial data into Vision REAL layers (public/data/*.geojson + content/layers/*.yaml)."
authors = [{ name = "Ye Zhang" }]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Imagery, elevation and flood screening (MUSA 6950 labs 3 and 4).
raster = ["rasterio>=1.3", "pystac-client>=0.8", "planetary-computer>=1.0", "pysheds>=0.4"]
# Land-cover classification (lab 6).
ml = ["scikit-learn>=1.4"]
# Shadow analysis (lab 5): read the DSM, save png maps, GIF and GeoTIFFs. Runs on the CPU.
shadow = ["rasterio>=1.3", "matplotlib>=3.8", "imageio>=2.34"]
# The PyCUDA version of the shadow kernel. Needs an NVIDIA GPU and the CUDA toolkit (e.g. Colab), not a Mac.
gpu = ["pycuda>=2024.1"]

[tool.uv]
package = false
